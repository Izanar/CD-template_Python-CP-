name: CI Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      DATABASE_URL: sqlite+aiosqlite:///file::memory:?cache=shared&uri=true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up config.json
        run: test -f config.json || cp config.json.sample config.json

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Poetry & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}-py3.10
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest


      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(poetry run coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          echo "COVERAGE_PERCENT=$COVERAGE" >> $GITHUB_ENV

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Code Coverage Report
            **Coverage**: ${{ env.COVERAGE_PERCENT }}%
            The test suite covered ${{ env.COVERAGE_PERCENT }}% of the `app` directory.
            📊 Check the detailed [coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in the workflow artifacts.


      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/


